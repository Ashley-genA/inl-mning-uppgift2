            </select>
            </label>
            </div>

            

            <form id="Bokform">
               <input type="text" id="Tittel" placeholder="Bokens tittle">
               <input type="text" id="Genre" placeholder="Bokens genre">
               <input type="text" id=" År" placeholder="utgivning datum">
               <button type="submit">Lägg till bok</button>
            </form>

            <div id="Boklista" class="Kort">

                <!-- id= för JS -->
                 <!-- class för CSS -->
